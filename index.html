<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday ❤️</title>

    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            color: white;
        }

        .box {
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            margin: auto;
            width: 70%;
            border-radius: 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 45px;
        }

        h2 {
            font-size: 30px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            background-color: white;
            color: #ff4f81;
            border: none;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff4f81;
            color: white;
        }

        #message {
            display: none;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🎂 Happy Birthday 🎂</h1>

        <h2>My Special Person ❤️</h2>

        <p>
            Happy Birthday to the most special person in my life! 💕
            <br>
            तुझ्या आयुष्यात नेहमी happiness, success आणि lots of love असू दे. ✨
            <br>
            Always keep smiling and stay happy! ❤️
        </p>

        <button onclick="showMessage()">
            Click Here ❤️
        </button>

        <div id="message">
            <h2>🎉 I Love You! ❤️ 🎉</h2>

            <p>
                तू माझ्यासाठी खूप special आहेस. 🥰
                <br>
                Happy Birthday once again! 🎂❤️
            </p>
        </div>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
